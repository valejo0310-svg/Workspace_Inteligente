<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Workspace</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!---Team members : Leonardo Perez, Valery Avila-->
    <div class="container">
        <header>
            <h1>My Workspace</h1>
            <button id="toggle-dark-mode">Luna/Sol</button>
        </header>

        <section class="input-section">
            <input type="text" id="task-input" placeholder="Nueva tarea...">
            <button id="add-task">Agregar</button>
        </section>

        <section class="filter-section">
            <input type="text" id="search-input" placeholder="Buscar temporalmente...">
            <div class="filters">
                <button data-filter="all">Todas</button>
                <button data-filter="pending">Pendientes</button>
                <button data-filter="completed">Completadas</button>
            </div>
        </section>

        <div id="stats">Completadas: <span id="completed-count">0</span></div>

        <ul id="task-list"></ul>
    </div>
    <script src="script.js"></script>
</body>
</html>
